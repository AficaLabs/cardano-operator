# StakePool CRD Schema
# API Group: cardano.org
# Version: v1alpha1
# This schema will be generated by controller-gen, documented here for reference

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stakepools.cardano.org
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
spec:
  group: cardano.org
  names:
    kind: StakePool
    listKind: StakePoolList
    plural: stakepools
    singular: stakepool
    shortNames:
      - sp
    categories:
      - cardano
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Network
          type: string
          jsonPath: .spec.network
        - name: Pool ID
          type: string
          jsonPath: .status.poolId
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: KES Expiry
          type: integer
          jsonPath: .status.kesExpiryEpoch
        - name: Blocks
          type: integer
          jsonPath: .status.blocksMinted
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - network
                - poolParams
                - nodeConfig
                - keyManagement
                - paymentConfig
                - storage
              properties:
                network:
                  type: string
                  enum:
                    - mainnet
                    - preprod
                    - preview
                  description: Cardano network to deploy on
                poolParams:
                  type: object
                  required:
                    - pledge
                    - margin
                    - cost
                    - metadata
                    - relays
                  properties:
                    pledge:
                      type: string
                      pattern: "^[0-9]+$"
                      description: Pledge amount in lovelace
                    margin:
                      type: string
                      pattern: "^0(\\.[0-9]+)?$|^1(\\.0+)?$"
                      description: Pool margin as decimal (0.0 to 1.0)
                    cost:
                      type: string
                      pattern: "^[0-9]+$"
                      description: Fixed cost per epoch in lovelace (min 340 ADA)
                    metadata:
                      type: object
                      required:
                        - url
                      properties:
                        url:
                          type: string
                          maxLength: 64
                          description: URL to pool metadata JSON
                        hash:
                          type: string
                          pattern: "^[a-f0-9]{64}$"
                          description: Pre-computed metadata hash
                    relays:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required:
                          - type
                          - port
                        properties:
                          type:
                            type: string
                            enum:
                              - dns
                              - ip
                          hostname:
                            type: string
                            description: DNS hostname (required if type=dns)
                          ipv4:
                            type: string
                            format: ipv4
                            description: IPv4 address (required if type=ip)
                          ipv6:
                            type: string
                            format: ipv6
                            description: IPv6 address
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                            default: 6000
                    rewardAccount:
                      type: string
                      pattern: "^stake[a-z0-9]+$"
                      description: Reward account address
                nodeConfig:
                  type: object
                  required:
                    - blockProducer
                    - relayCount
                    - relaySpec
                  properties:
                    blockProducer:
                      type: object
                      properties:
                        resources:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        nodeSelector:
                          type: object
                          additionalProperties:
                            type: string
                        tolerations:
                          type: array
                          items:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                    relayCount:
                      type: integer
                      minimum: 1
                      default: 2
                      description: Number of relay nodes (min 2 for production)
                    relaySpec:
                      type: object
                      properties:
                        resources:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        nodeSelector:
                          type: object
                          additionalProperties:
                            type: string
                    nodeVersion:
                      type: string
                      description: Cardano node version
                keyManagement:
                  type: object
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum:
                        - managed
                        - external
                      description: Key management mode
                    coldKeySecretRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: cold.skey
                    offlineSigningNodeRef:
                      type: string
                      description: OfflineSigningNode name for external signing
                    kesRotationLeadEpochs:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 2
                paymentConfig:
                  type: object
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum:
                        - automated
                        - external
                    paymentKeySecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: payment.skey
                    paymentAddress:
                      type: string
                      pattern: "^addr[a-z0-9]+$"
                storage:
                  type: object
                  required:
                    - size
                  properties:
                    storageClassName:
                      type: string
                    size:
                      type: string
                      pattern: "^[0-9]+[KMGTPE]i?$"
                    accessModes:
                      type: array
                      items:
                        type: string
                        enum:
                          - ReadWriteOnce
                          - ReadWriteMany
                          - ReadOnlyMany
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Syncing
                    - Registering
                    - Active
                    - Updating
                    - Retiring
                    - Retired
                    - Error
                poolId:
                  type: string
                  description: Bech32 pool ID
                poolIdHex:
                  type: string
                  description: Hex pool ID
                currentEpoch:
                  type: integer
                kesExpiryEpoch:
                  type: integer
                blocksMinted:
                  type: integer
                lastBlockSlot:
                  type: integer
                registrationTxHash:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                      phase:
                        type: string
                      syncProgress:
                        type: string

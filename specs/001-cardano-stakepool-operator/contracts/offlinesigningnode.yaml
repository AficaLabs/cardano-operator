# OfflineSigningNode CRD Schema
# API Group: cardano.org
# Version: v1alpha1

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: offlinesigningnodes.cardano.org
spec:
  group: cardano.org
  names:
    kind: OfflineSigningNode
    listKind: OfflineSigningNodeList
    plural: offlinesigningnodes
    singular: offlinesigningnode
    shortNames:
      - osn
    categories:
      - cardano
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Pool
          type: string
          jsonPath: .spec.stakePoolRef
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Pending
          type: integer
          jsonPath: .status.pendingRequestCount
        - name: Last Activity
          type: date
          jsonPath: .status.lastActivity
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - stakePoolRef
                - signingMode
              properties:
                stakePoolRef:
                  type: string
                  description: Associated StakePool name
                signingMode:
                  type: string
                  enum:
                    - manual
                    - isolated
                  description: |
                    manual: User exports unsigned tx, signs offline, imports signature
                    isolated: Dedicated isolated namespace for signing ceremonies
                requestRetentionDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 30
                  description: Days to retain completed signing requests
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Idle
                    - RequestPending
                    - AwaitingSignature
                    - Processing
                    - Error
                pendingRequestCount:
                  type: integer
                lastActivity:
                  type: string
                  format: date-time
                pendingRequests:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - type
                      - status
                    properties:
                      id:
                        type: string
                        description: Unique request identifier
                      type:
                        type: string
                        enum:
                          - registration
                          - update
                          - kes-rotation
                          - retirement
                      createdAt:
                        type: string
                        format: date-time
                      unsignedTxBody:
                        type: string
                        description: Base64-encoded unsigned transaction body
                      unsignedTxHash:
                        type: string
                        description: Transaction hash for verification
                      signedTx:
                        type: string
                        description: Base64-encoded signed transaction (user provides)
                      txHash:
                        type: string
                        description: Submitted transaction hash
                      status:
                        type: string
                        enum:
                          - pending
                          - awaiting-signature
                          - signed
                          - submitted
                          - confirmed
                          - failed
                      errorMessage:
                        type: string
                completedRequests:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      completedAt:
                        type: string
                        format: date-time
                      txHash:
                        type: string
                      status:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time

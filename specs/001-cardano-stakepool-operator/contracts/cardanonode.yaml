# CardanoNode CRD Schema
# API Group: cardano.org
# Version: v1alpha1

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cardanonodes.cardano.org
spec:
  group: cardano.org
  names:
    kind: CardanoNode
    listKind: CardanoNodeList
    plural: cardanonodes
    singular: cardanonode
    shortNames:
      - cn
    categories:
      - cardano
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Network
          type: string
          jsonPath: .spec.network
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Sync
          type: string
          jsonPath: .status.syncProgress
        - name: Peers
          type: integer
          jsonPath: .status.peerCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
                - network
                - storage
              properties:
                type:
                  type: string
                  enum:
                    - block-producer
                    - relay
                    - offline-signing
                  description: Node type
                network:
                  type: string
                  enum:
                    - mainnet
                    - preprod
                    - preview
                nodeVersion:
                  type: string
                  description: Cardano node version tag
                topology:
                  type: object
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum:
                        - static
                        - p2p
                    staticPeers:
                      type: array
                      items:
                        type: object
                        required:
                          - address
                          - port
                        properties:
                          address:
                            type: string
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                    p2pConfig:
                      type: object
                      properties:
                        targetNumberOfActivePeers:
                          type: integer
                          default: 20
                        targetNumberOfEstablishedPeers:
                          type: integer
                          default: 40
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                storage:
                  type: object
                  required:
                    - size
                  properties:
                    storageClassName:
                      type: string
                    size:
                      type: string
                      pattern: "^[0-9]+[KMGTPE]i?$"
                stakePoolRef:
                  type: string
                  description: Owning StakePool name
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Starting
                    - Syncing
                    - Running
                    - Error
                syncProgress:
                  type: string
                tipSlot:
                  type: integer
                tipEpoch:
                  type: integer
                peerCount:
                  type: integer
                nodeVersion:
                  type: string
                podName:
                  type: string
                serviceName:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time

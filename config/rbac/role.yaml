---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cardano.cardano.org
  resources:
  - cardanonodes
  - kesrotations
  - offlinesigningnodes
  - stakepools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cardano.cardano.org
  resources:
  - cardanonodes/finalizers
  - kesrotations/finalizers
  - offlinesigningnodes/finalizers
  - stakepools/finalizers
  verbs:
  - update
- apiGroups:
  - cardano.cardano.org
  resources:
  - cardanonodes/status
  - kesrotations/status
  - offlinesigningnodes/status
  - stakepools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-cardano-org-v1alpha1-cardanonode
  failurePolicy: Fail
  name: vcardanonode.kb.io
  rules:
  - apiGroups:
    - cardano.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cardanonodes
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-cardano-org-v1alpha1-stakepool
  failurePolicy: Fail
  name: vstakepool.kb.io
  rules:
  - apiGroups:
    - cardano.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - stakepools
  sideEffects: None
